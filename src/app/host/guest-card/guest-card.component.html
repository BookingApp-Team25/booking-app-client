<mat-card class="comment-card">
    <div class="main">
      <mat-card-header>
        <mat-card-title-group>
          <mat-card-title><div style="display: flex;"><span class="reviewer-name">{{guest.firstName}} {{guest.lastName}}</span></div></mat-card-title>
        </mat-card-title-group>
      </mat-card-header>
      <mat-card-content>
        <p>Username: {{guest.username}}</p>
        <p>Phone number: {{guest.phoneNumber}}</p>
      </mat-card-content>
    </div>
    <div class="button">
      <button (click)="openDialog()">
        <mat-icon style="color: red; transform: scale(1.5);">report</mat-icon>
      </button>
      </div>
    </mat-card>
