<meta name="viewport" content="width=device-width, initial-scale=1.0">
<mat-toolbar class="navbar">
  <a [routerLink]="['home']">
  <img class="image" src="..\..\assets\images\logo.png" />
  </a>
  <div class="search-frame">
    <img class="img" src="..\..\assets\images\location_city.png" />
    <form class="cities-form" [formGroup]="searchForm">
        <input  id="city-input" type="text"
                placeholder="City"
               matInput
               [formControl]="myControl"
               [matAutocomplete]="auto">
        <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredOptions | async; track option"  [value]="option">{{option}}</mat-option>
        </mat-autocomplete>
    </form>
    <img class="line" src="..\..\assets\images\Line 1.png" />
      <mat-date-range-input [rangePicker]="picker" style="min-width: 240px;" >
        <input matStartDate placeholder="Start date" [readonly]="true" style="font-size: 16px;" #startDateInput>
        <input matEndDate placeholder="End date" [readonly]="true" style="font-size: 16px;" #endDateInput>
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker" ></mat-datepicker-toggle>
      <mat-date-range-picker #picker ></mat-date-range-picker>
    <img class="line" src="..\..\assets\images\Line 1.png" />
    <img class="img" src="..\..\assets\images\people_alt.png" />
    <input id="guests-input" type="number" min="1" max="50" #guestsInput>
    <div style="display: flex">
      <button (click)="handleSearch()">
        <mat-icon>search</mat-icon>
      </button>
      <button  (click)="openDialog()">
        <mat-icon>filter_list</mat-icon>
      </button>
    </div>
  </div>
  <button [matMenuTriggerFor]="menu">
  <div class="account-button" >
    <img class="img" src="..\..\assets\images\menu_24px.png" />
    <img class="icons-account-circle" src="..\..\assets\images\account_circle_filled_24px.png" />
  </div>
</button>
<mat-menu class="account-menu" #menu="matMenu">
  <button mat-menu-item (click)="openLogin()" *ngIf="role==null">Login</button>
  <button mat-menu-item routerLink="/registration" *ngIf="role==null">Register</button>
  <button mat-menu-item routerLink="user-profile" *ngIf="role!=null">Account</button>
  <button mat-menu-item [routerLink]="['/accommodation-creation', { pageMode: 'create' }]" *ngIf="role == 'ROLE_Host'">New accommodation</button>
  <button mat-menu-item routerLink="/accommodation-requests" *ngIf="role == 'ROLE_Admin'">View acc requests</button>
  <button mat-menu-item routerLink="/comment-review" *ngIf="role == 'ROLE_Admin'">View reported comments</button>
  <button mat-menu-item routerLink="/user-blocking" *ngIf="role == 'ROLE_Admin'">View reported users</button>
  <button mat-menu-item routerLink="/host-accommodations" *ngIf="role== 'ROLE_Host'">Host accommodations</button>
  <button mat-menu-item routerLink="/home/my-guests" *ngIf="role== 'ROLE_Host'">My guests</button>
  <button mat-menu-item routerLink="/host-accommodations" *ngIf="role== 'ROLE_Host'">Your accommodations</button>
  <button mat-menu-item routerLink="/host-reservation-requests" *ngIf="role== 'ROLE_Host'">View requests</button>
  <button mat-menu-item routerLink="/guest-reservations-view" *ngIf="role == 'ROLE_Guest'">View reservations</button>
  <button mat-menu-item routerLink="/guest-favourite-accommodations" *ngIf="role == 'ROLE_Guest'">Favourite accommodaitons</button>
  <button mat-menu-item routerLink="/host-generate-report" *ngIf="role== 'ROLE_Host'">Generate report</button>
  <!-- PROMENITI NA ROLE_Admin -->
  <button mat-menu-item routerLink="/admin-certificate-tree" *ngIf="role== 'ROLE_Admin'">Certificate tree</button>
  <button mat-menu-item (click)="logOut()" *ngIf="role != null">Logout</button>
</mat-menu>
</mat-toolbar>
