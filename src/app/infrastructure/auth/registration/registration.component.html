<form class="registration-wrapper" [formGroup]="registrationForm" (ngSubmit)="register()">
    <div class="title">
        <h1>Create account</h1>
    </div>
    <div class="registration-body">
        <section>
            <mat-form-field class="email" appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput formControlName="email" placeholder="Enter your email">
            </mat-form-field>
      
            <mat-form-field class="password" appearance="outline">
              <mat-label>Password</mat-label>
              <input matInput type="password" formControlName="password" placeholder="Enter your password">
            </mat-form-field>
      
            <mat-form-field class="repeat-password" appearance="outline">
              <mat-label>Repeat password</mat-label>
              <input matInput type="password" formControlName="repeatPassword" placeholder="Repeat your password">
            </mat-form-field>
      
            <mat-form-field class="phone" appearance="outline">
              <mat-label>Phone number</mat-label>
              <input matInput formControlName="phone" placeholder="Enter your phone number">
            </mat-form-field>
          </section>
      
          <section>
            <mat-form-field class="first-name" appearance="outline">
              <mat-label>First name</mat-label>
              <input matInput formControlName="firstName" placeholder="Enter your first name">
            </mat-form-field>
      
            <mat-form-field class="last-name" appearance="outline">
              <mat-label>Last name</mat-label>
              <input matInput formControlName="lastName" placeholder="Enter your last name">
            </mat-form-field>
      
            <mat-form-field class="address" appearance="outline">
              <mat-label>Address</mat-label>
              <input matInput formControlName="address" placeholder="Enter your address">
            </mat-form-field>
      
            <div class="radio-buttons">
              <p><b>Register me as</b></p>
                <mat-radio-group formControlName="role" class="radio-group">
                    <mat-radio-button *ngFor="let role of roles" [value]="role.value">{{ role.label }}</mat-radio-button>
                </mat-radio-group>
            </div>
          </section>
    </div>
    <div class="bottom">
        <button type="submit">Create account</button>
    </div>
</form>
