<div id="mainDiv">
  <form id="form">
    <p id="title">Personal information</p>
    <mat-form-field appearance="outline">
      <mat-label>Enter password</mat-label>
      <input matInput type="password" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Repeat password</mat-label>
      <input matInput type="password"/>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>First name</mat-label>
      <input matInput type="text" value="{{account.firstName}}"/>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Last name</mat-label>
      <input matInput type="text" value="{{account.lastName}}"/>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Phone number</mat-label>
      <input matInput type="tel" value="{{account.phoneNumber}}"/>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Address</mat-label>
      <input matInput  type="address" value="{{account.address}}"/>
    </mat-form-field>
    <div style="display: flex; width: 50%; justify-content: center; gap: 60px;">
      <button id="edit-button" mat-button>Edit account</button>
      <button id="delete-button" mat-button>Delete</button>
    </div>
  </form>
</div>
