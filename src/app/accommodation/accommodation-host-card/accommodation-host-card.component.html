<div class="accommodation-frame" [routerLink]="['accommodationView']">
    <img class="accommodation-image" src="..\..\assets\images\AccommodationImage.png" />
    <div class="accommodation-info">
        <div class="accommodation-name">{{summary.name}}</div>
        <div class="desc">
            <p class="description-text">
                {{summary.description}}
            </p>
        </div>
        <div class="info">
            <div class="text-wrapper">{{summary.}}$ per night</div>
        </div>
    </div>
</div>
