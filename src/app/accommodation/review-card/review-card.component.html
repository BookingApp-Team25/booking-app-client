<mat-card class="comment-card">
  <div class="main">
    <mat-card-header>
      <mat-card-title-group>
        <mat-card-title><div style="display: flex;"><span class="reviewer-name">{{review.guestName}}</span>&nbsp;&nbsp;&nbsp;<span class="review-rating">{{review.rating}}</span><mat-icon style="transform: scale(0.8); margin-top: 2%;">star</mat-icon></div></mat-card-title>
        <mat-card-subtitle>{{review.date}}</mat-card-subtitle>
      </mat-card-title-group>
    </mat-card-header>
    <mat-card-content>
      {{review.comment}}
    </mat-card-content>
  </div>
  <div class="button">
    <button (click)="reportReview()">
      <mat-icon *ngIf="role=='ROLE_Host' && !review.reported && accommodationDetails.hostUsername==username" style="color: red; transform: scale(1.5);">report</mat-icon>
    </button>
    <button (click)="deleteReview()">
      <mat-icon *ngIf="role=='ROLE_Guest' && username==review.guestUsername" style="transform: scale(1.5);">remove_circle_outline</mat-icon>
    </button>
      <mat-icon *ngIf="review.reported && role=='ROLE_Host' && accommodationDetails.hostUsername==username" style="transform: scale(1.5); color: red;">report_problem</mat-icon>
  </div>
  </mat-card>
